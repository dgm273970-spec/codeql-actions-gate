
name: Fork Artifact Consumer

on:
  workflow_run:
    workflows:
      - Fork Artifact Producer
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  consume-fork-artifact:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Collect producer run and artifact API evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const eventRun = context.payload.workflow_run;

            if (!eventRun || !eventRun.id) {
              throw new Error("Missing workflow_run event");
            }

            const runResponse = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: eventRun.id
            });
            const run = runResponse.data;

            if (run.event !== "pull_request") {
              throw new Error("Producer run is not a pull_request event");
            }

            const base = run.repository || {};
            const fork = run.head_repository || {};

            if (!base.id || !fork.id || Number(base.id) === Number(fork.id)) {
              throw new Error("A distinct Fork repository is required");
            }

            const prs = run.pull_requests || [];
            const pr = prs[0];

            if (!pr || !pr.number || !pr.head ||
                !pr.head.sha || !pr.head.ref) {
              throw new Error("Cannot obtain PR head provenance");
            }

            const artifactResponse =
              await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              });

            const matches = artifactResponse.data.artifacts.filter(
              a => a.name === "fork-pr-provenance" && !a.expired
            );

            if (matches.length !== 1) {
              throw new Error(
                `Expected exactly one provenance artifact, got ${matches.length}`
              );
            }

            const artifact = matches[0];

            const workflowResponse =
              await github.rest.actions.getWorkflow({
                owner,
                repo,
                workflow_id: run.workflow_id
              });

            const workflow = workflowResponse.data;

            let workflowBlobSha = null;
            let workflowBlobError = null;

            try {
              const contentResponse =
                await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: workflow.path,
                  ref: run.head_sha
                });

              const content = contentResponse.data;

              if (Array.isArray(content) || content.type !== "file") {
                throw new Error("Workflow path is not a single file");
              }

              workflowBlobSha = content.sha;
            } catch (error) {
              workflowBlobError = String(error.message || error).slice(0, 300);
            }

            const jobsResponse =
              await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              });

            const uploadSteps = jobsResponse.data.jobs.flatMap(job =>
              (job.steps || [])
                .filter(step =>
                  /upload.*artifact|artifact.*upload/i.test(step.name || "")
                )
                .map(step => ({
                  job_name: job.name,
                  step_name: step.name,
                  conclusion: step.conclusion
                }))
            );

            const metadata = {
              base_repository: {
                id: base.id,
                full_name: base.full_name
              },
              fork_repository: {
                id: fork.id,
                full_name: fork.full_name
              },
              pull_request: {
                number: pr.number,
                head_sha: pr.head.sha,
                head_branch: pr.head.ref,
                head_repository_id: pr.head.repo ? pr.head.repo.id : null
              },
              producer_run: {
                id: run.id,
                event: run.event,
                conclusion: run.conclusion,
                head_sha: run.head_sha,
                head_branch: run.head_branch,
                workflow_id: run.workflow_id
              },
              workflow: {
                id: run.workflow_id,
                path: workflow.path,
                blob_sha: workflowBlobSha,
                blob_sha_ref: run.head_sha,
                blob_sha_error: workflowBlobError
              },
              artifact: {
                id: artifact.id,
                name: artifact.name,
                digest: artifact.digest,
                size_in_bytes: artifact.size_in_bytes,
                created_at: artifact.created_at
              },
              upload_steps: uploadSteps,
              api_response_summary: {
                workflow_run_status: runResponse.status,
                artifact_list_status: artifactResponse.status,
                jobs_list_status: jobsResponse.status,
                workflow_status: workflowResponse.status
              }
            };

            fs.mkdirSync("consumer-evidence", { recursive: true });

            fs.writeFileSync(
              "consumer-evidence/api-metadata.json",
              JSON.stringify(metadata, null, 2)
            );

            core.info("Producer API evidence collected.");

      - name: Download artifact from exact producer run
        uses: actions/download-artifact@v4
        with:
          name: fork-pr-provenance
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence

      - name: Validate provenance and record dry-run sink
        env:
          CONSUMER_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path

          metadata = json.loads(
              Path("consumer-evidence/api-metadata.json").read_text()
          )

          artifact_path = Path("evidence/pr-provenance.json")

          if not artifact_path.is_file():
              raise RuntimeError("Downloaded provenance JSON is missing")

          raw = artifact_path.read_bytes()
          payload = json.loads(raw.decode("utf-8"))

          run = metadata["producer_run"]
          pr = metadata["pull_request"]
          artifact = metadata["artifact"]

          if int(payload["producer_run_id"]) != int(run["id"]):
              raise RuntimeError("Producer Run ID mismatch")

          if payload["head_sha"] != pr["head_sha"]:
              raise RuntimeError("PR head SHA mismatch")

          if payload["head_branch"] != pr["head_branch"]:
              raise RuntimeError("PR head branch mismatch")

          if payload["marker"] != "controlled-test-only":
              raise RuntimeError("Unexpected provenance marker")

          if not payload.get("test_case"):
              raise RuntimeError("Missing test_case")

          if int(metadata["fork_repository"]["id"]) == int(
              metadata["base_repository"]["id"]
          ):
              raise RuntimeError("Producer is not from a distinct Fork")

          downloaded_sha256 = hashlib.sha256(raw).hexdigest()

          summary = {
              "result": "PASS",
              "consumer_run_id": os.environ["CONSUMER_RUN_ID"],
              "base_repository": metadata["base_repository"],
              "fork_repository": metadata["fork_repository"],
              "pull_request": pr,
              "producer_run": run,
              "workflow": metadata["workflow"],
              "artifact": {
                  **artifact,
                  "downloaded_json_sha256": downloaded_sha256
              },
              "upload_steps": metadata["upload_steps"],
              "checks": {
                  "fork_repository_distinct": True,
                  "producer_run_id_matches": True,
                  "pr_head_sha_matches": True,
                  "pr_head_branch_matches": True,
                  "controlled_marker_matches": True,
                  "artifact_json_parsed": True
              },
              "dry_run_sink": {
                  "repository": metadata["base_repository"]["full_name"],
                  "ref": (
                      f"refs/heads/fork-evidence/pr-{pr['number']}-"
                      f"{pr['head_sha'][:12]}"
                  ),
                  "operation": "would_write_ref",
                  "performed": False
              }
          }

          Path("consumer-evidence/verification.json").write_text(
              json.dumps(summary, indent=2)
          )

          print(json.dumps({
              "result": summary["result"],
              "producer_run_id": run["id"],
              "artifact_id": artifact["id"],
              "downloaded_json_sha256": downloaded_sha256,
              "dry_run_sink": summary["dry_run_sink"]
          }, indent=2))
          PY

      - name: Upload consumer verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: fork-consumer-verification
          path: consumer-evidence/
          if-no-files-found: error
          retention-days: 30
