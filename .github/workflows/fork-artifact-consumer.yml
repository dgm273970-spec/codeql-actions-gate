
name: Fork Artifact Consumer

on:
  workflow_run:
    workflows:
      - Fork Artifact Producer
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  consume-fork-artifact:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact from exact producer run
        uses: actions/download-artifact@v4
        with:
          name: fork-pr-provenance
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence

      - name: Collect producer run and PR API evidence
        uses: actions/github-script@v7
        env:
          PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const fs = require("fs");

            const { owner, repo } = context.repo;
            const producerRunId = Number(process.env.PRODUCER_RUN_ID);

            const artifactPath = "evidence/pr-provenance.json";

            if (!fs.existsSync(artifactPath)) {
              throw new Error("Downloaded provenance JSON is missing");
            }

            const producer = JSON.parse(
              fs.readFileSync(artifactPath, "utf8")
            );

            if (producer.event_name !== "pull_request") {
              throw new Error("Artifact event_name is not pull_request");
            }

            if (Number(producer.run_id) !== producerRunId) {
              throw new Error("Artifact producer Run ID mismatch");
            }

            const sourcePR = producer.pull_request || {};
            const prNumber = Number(sourcePR.number);

            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              throw new Error("Invalid PR number in provenance artifact");
            }

            if (
              !sourcePR.head_repository ||
              !sourcePR.head_repository_id ||
              !sourcePR.head_sha ||
              !sourcePR.head_ref ||
              !sourcePR.base_repository ||
              !sourcePR.base_repository_id ||
              !sourcePR.base_ref
            ) {
              throw new Error("Incomplete PR provenance fields");
            }

            // Obtain authoritative producer run information.
            const runResponse =
              await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: producerRunId
              });

            const run = runResponse.data;

            if (Number(run.id) !== producerRunId) {
              throw new Error("GitHub producer Run ID mismatch");
            }

            if (run.event !== "pull_request") {
              throw new Error("Producer run is not a pull_request event");
            }

            if (run.conclusion !== "success") {
              throw new Error("Producer run did not succeed");
            }

            const base = run.repository || {};
            const fork = run.head_repository || {};

            if (!base.id || !fork.id) {
              throw new Error("Missing producer repository identity");
            }

            if (Number(base.id) === Number(fork.id)) {
              throw new Error("A distinct Fork repository is required");
            }

            if (Number(base.id) !== Number(producer.repository_id)) {
              throw new Error("Base repository ID mismatch");
            }

            if (
              Number(fork.id) !== Number(sourcePR.head_repository_id)
            ) {
              throw new Error("Fork repository ID mismatch");
            }

            if (base.full_name !== sourcePR.base_repository) {
              throw new Error("Base repository name mismatch");
            }

            if (fork.full_name !== sourcePR.head_repository) {
              throw new Error("Fork repository name mismatch");
            }

            if (run.head_branch !== sourcePR.head_ref) {
              throw new Error("Producer head branch mismatch");
            }

            if (
              Number(run.run_attempt) !== Number(producer.run_attempt)
            ) {
              throw new Error("Producer run attempt mismatch");
            }

            // Use the artifact PR number only as a lookup candidate.
            // The actual PR identity and fields must be verified via API.
            const prResponse = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber
            });

            const pr = prResponse.data;

            if (Number(pr.number) !== prNumber) {
              throw new Error("GitHub PR number mismatch");
            }

            if (!pr.head || !pr.head.repo || !pr.base || !pr.base.repo) {
              throw new Error("PR head or base repository is unavailable");
            }

            if (
              Number(pr.head.repo.id) !== Number(sourcePR.head_repository_id)
            ) {
              throw new Error("PR head repository ID mismatch");
            }

            if (
              Number(pr.base.repo.id) !== Number(sourcePR.base_repository_id)
            ) {
              throw new Error("PR base repository ID mismatch");
            }

            if (pr.head.repo.full_name !== sourcePR.head_repository) {
              throw new Error("PR head repository name mismatch");
            }

            if (pr.base.repo.full_name !== sourcePR.base_repository) {
              throw new Error("PR base repository name mismatch");
            }

            if (pr.head.sha !== sourcePR.head_sha) {
              throw new Error("PR head SHA mismatch");
            }

            if (pr.head.ref !== sourcePR.head_ref) {
              throw new Error("PR head branch mismatch");
            }

            if (pr.base.ref !== sourcePR.base_ref) {
              throw new Error("PR base branch mismatch");
            }

            if (pr.html_url !== sourcePR.url) {
              throw new Error("PR URL mismatch");
            }

            // If the workflow run API provides PR associations,
            // independently check the association as well.
            const associatedPRs = run.pull_requests || [];

            if (associatedPRs.length > 0) {
              const associatedPR = associatedPRs.find(
                item => Number(item.number) === prNumber
              );

              if (!associatedPR) {
                throw new Error(
                  "Producer run PR association does not match artifact"
                );
              }

              if (
                associatedPR.head &&
                associatedPR.head.sha &&
                associatedPR.head.sha !== sourcePR.head_sha
              ) {
                throw new Error(
                  "Workflow run PR association head SHA mismatch"
                );
              }
            }

            // Verify the artifact belongs to this exact producer run.
            const artifactResponse =
              await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: producerRunId,
                per_page: 100
              });

            const matches = artifactResponse.data.artifacts.filter(
              artifact =>
                artifact.name === "fork-pr-provenance" &&
                !artifact.expired
            );

            if (matches.length !== 1) {
              throw new Error(
                `Expected exactly one provenance artifact, got ${matches.length}`
              );
            }

            const artifact = matches[0];

            const workflowResponse =
              await github.rest.actions.getWorkflow({
                owner,
                repo,
                workflow_id: run.workflow_id
              });

            const workflow = workflowResponse.data;

            let workflowBlobSha = null;
            let workflowBlobError = null;

            try {
              const contentResponse =
                await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: workflow.path,
                  ref: producer.workflow_sha
                });

              const content = contentResponse.data;

              if (Array.isArray(content) || content.type !== "file") {
                throw new Error("Workflow path is not a single file");
              }

              workflowBlobSha = content.sha;
            } catch (error) {
              workflowBlobError = String(
                error.message || error
              ).slice(0, 300);
            }

            const jobsResponse =
              await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: producerRunId,
                per_page: 100
              });

            const uploadSteps = jobsResponse.data.jobs.flatMap(job =>
              (job.steps || [])
                .filter(step =>
                  /upload.*artifact|artifact.*upload/i.test(step.name || "")
                )
                .map(step => ({
                  job_name: job.name,
                  step_name: step.name,
                  conclusion: step.conclusion
                }))
            );

            if (
              !uploadSteps.some(step => step.conclusion === "success")
            ) {
              throw new Error("No successful artifact upload step found");
            }

            const metadata = {
              base_repository: {
                id: base.id,
                full_name: base.full_name
              },
              fork_repository: {
                id: fork.id,
                full_name: fork.full_name
              },
              pull_request: {
                number: pr.number,
                state: pr.state,
                url: pr.html_url,
                head_sha: pr.head.sha,
                head_branch: pr.head.ref,
                head_repository_id: pr.head.repo.id,
                head_repository: pr.head.repo.full_name,
                base_branch: pr.base.ref,
                base_repository_id: pr.base.repo.id,
                base_repository: pr.base.repo.full_name
              },
              producer_run: {
                id: run.id,
                event: run.event,
                conclusion: run.conclusion,
                head_sha: run.head_sha,
                head_branch: run.head_branch,
                run_attempt: run.run_attempt,
                workflow_id: run.workflow_id,
                html_url: run.html_url
              },
              workflow: {
                id: run.workflow_id,
                path: workflow.path,
                workflow_sha: producer.workflow_sha,
                blob_sha: workflowBlobSha,
                blob_sha_error: workflowBlobError
              },
              artifact: {
                id: artifact.id,
                name: artifact.name,
                digest: artifact.digest,
                size_in_bytes: artifact.size_in_bytes,
                created_at: artifact.created_at
              },
              upload_steps: uploadSteps,
              api_response_summary: {
                workflow_run_status: runResponse.status,
                pull_request_status: prResponse.status,
                artifact_list_status: artifactResponse.status,
                jobs_list_status: jobsResponse.status,
                workflow_status: workflowResponse.status
              },
              checks: {
                run_id_matches: true,
                event_is_pull_request: true,
                fork_repository_distinct: true,
                base_repository_matches: true,
                fork_repository_matches: true,
                pr_number_matches: true,
                pr_head_sha_matches: true,
                pr_head_branch_matches: true,
                pr_base_branch_matches: true,
                pr_url_matches: true,
                artifact_belongs_to_exact_run: true
              }
            };

            fs.mkdirSync("consumer-evidence", {
              recursive: true
            });

            fs.writeFileSync(
              "consumer-evidence/api-metadata.json",
              JSON.stringify(metadata, null, 2)
            );

            core.info("Producer run and PR API evidence collected.");

            core.info(JSON.stringify(metadata.checks, null, 2));

      - name: Validate provenance and record dry-run sink
        env:
          CONSUMER_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path

          metadata = json.loads(
              Path("consumer-evidence/api-metadata.json").read_text()
          )

          artifact_path = Path("evidence/pr-provenance.json")

          if not artifact_path.is_file():
              raise RuntimeError("Downloaded provenance JSON is missing")

          raw = artifact_path.read_bytes()
          payload = json.loads(raw.decode("utf-8"))

          run = metadata["producer_run"]
          pr = metadata["pull_request"]
          artifact = metadata["artifact"]

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          require(
              payload["event_name"] == "pull_request",
              "Producer event mismatch"
          )

          require(
              int(payload["run_id"]) == int(run["id"]),
              "Producer Run ID mismatch"
          )

          require(
              int(payload["run_attempt"]) == int(run["run_attempt"]),
              "Producer run attempt mismatch"
          )

          require(
              int(payload["repository_id"]) ==
              int(metadata["base_repository"]["id"]),
              "Base repository ID mismatch"
          )

          require(
              payload["repository"] ==
              metadata["base_repository"]["full_name"],
              "Base repository name mismatch"
          )

          source_pr = payload["pull_request"]

          require(
              int(source_pr["number"]) == int(pr["number"]),
              "PR number mismatch"
          )

          require(
              int(source_pr["head_repository_id"]) ==
              int(pr["head_repository_id"]),
              "Fork repository ID mismatch"
          )

          require(
              int(source_pr["base_repository_id"]) ==
              int(pr["base_repository_id"]),
              "Base repository ID mismatch"
          )

          require(
              source_pr["head_repository"] == pr["head_repository"],
              "Fork repository name mismatch"
          )

          require(
              source_pr["base_repository"] == pr["base_repository"],
              "Base repository name mismatch"
          )

          require(
              source_pr["head_sha"] == pr["head_sha"],
              "PR head SHA mismatch"
          )

          require(
              source_pr["head_ref"] == pr["head_branch"],
              "PR head branch mismatch"
          )

          require(
              source_pr["base_ref"] == pr["base_branch"],
              "PR base branch mismatch"
          )

          require(
              source_pr["url"] == pr["url"],
              "PR URL mismatch"
          )

          require(
              int(metadata["fork_repository"]["id"]) !=
              int(metadata["base_repository"]["id"]),
              "Producer is not from a distinct Fork"
          )

          require(
              artifact["name"] == "fork-pr-provenance",
              "Unexpected artifact name"
          )

          downloaded_sha256 = hashlib.sha256(raw).hexdigest()

          checks = {
              "event_is_pull_request": True,
              "producer_run_id_matches": True,
              "producer_run_attempt_matches": True,
              "base_repository_id_matches": True,
              "base_repository_name_matches": True,
              "fork_repository_id_matches": True,
              "fork_repository_name_matches": True,
              "pr_number_matches": True,
              "pr_head_sha_matches": True,
              "pr_head_branch_matches": True,
              "pr_base_branch_matches": True,
              "pr_url_matches": True,
              "artifact_json_parsed": True,
              "artifact_belongs_to_exact_run": True
          }

          summary = {
              "result": "PASS",
              "consumer_run_id": os.environ["CONSUMER_RUN_ID"],
              "base_repository": metadata["base_repository"],
              "fork_repository": metadata["fork_repository"],
              "pull_request": pr,
              "producer_run": run,
              "workflow": metadata["workflow"],
              "artifact": {
                  **artifact,
                  "downloaded_json_sha256": downloaded_sha256
              },
              "upload_steps": metadata["upload_steps"],
              "checks": checks,
              "dry_run_sink": {
                  "repository": metadata["base_repository"]["full_name"],
                  "ref": (
                      f"refs/heads/fork-evidence/pr-{pr['number']}-"
                      f"{pr['head_sha'][:12]}"
                  ),
                  "operation": "would_write_ref",
                  "performed": False
              }
          }

          Path("consumer-evidence/verification.json").write_text(
              json.dumps(summary, indent=2)
          )

          print(json.dumps({
              "result": summary["result"],
              "producer_run_id": run["id"],
              "consumer_run_id": summary["consumer_run_id"],
              "pull_request_number": pr["number"],
              "artifact_id": artifact["id"],
              "downloaded_json_sha256": downloaded_sha256,
              "checks": checks,
              "dry_run_sink": summary["dry_run_sink"]
          }, indent=2))
          PY

      - name: Upload consumer verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: fork-consumer-verification
          path: consumer-evidence/
          if-no-files-found: error
          retention-days: 30
